<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F5F7F4; --surface:#FFFFFF; --ink:#1B2320; --muted:#5C6A64;
  --line:#DDE4DF; --accent:#0E7A5F; --accent-ink:#0A5C48; --accent-soft:#E3F0EA;
  --signal:#BE4736; --signal-soft:#F7E7E3; --mono-bg:#EDF1EE;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#111614; --surface:#1A211E; --ink:#E7ECE8; --muted:#96A49D;
    --line:#2B342F; --accent:#43C299; --accent-ink:#6FD8B4; --accent-soft:#1D2E27;
    --signal:#E27562; --signal-soft:#332019; --mono-bg:#202824;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 "Source Sans 3",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:36px 20px 80px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
h1{font-family:"Schibsted Grotesk",sans-serif;font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:14px}
button{font:600 14px "Source Sans 3",sans-serif;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:10px;align-items:center;margin:14px 0 26px;flex-wrap:wrap}
.quiet{font-size:14px;color:var(--muted)}
.quiet a{color:var(--accent-ink);cursor:pointer;text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.card.lane4{border-left:4px solid var(--signal)}
.card.lane3{border-left:4px solid var(--accent)}
.tag{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.lane4 .tag{color:var(--signal)}
.lane3 .tag{color:var(--accent-ink)}
.title{font-family:"Schibsted Grotesk",sans-serif;font-weight:700;font-size:16.5px}
.title a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.summary{font-size:15.5px}
.reason{font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:110px;background:var(--mono-bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:400 14px/1.6 "Source Sans 3",sans-serif;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.draft-label{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:14px;color:var(--accent-ink);font-weight:600}
.status.err{color:var(--signal)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:40px;text-align:center;color:var(--muted)}
#noise-list{display:none;margin:0 0 24px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--muted)}
#noise-list.open{display:block}
#noise-list li{margin:4px 0}
/* connections */
#conn-chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:7px;font:500 12px "IBM Plex Mono",monospace;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);cursor:pointer}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--signal);flex:none}
.chip.on .dot{background:var(--accent)}
#conn-panel{display:none;margin:0 0 26px;flex-direction:column;gap:10px}
#conn-panel.open{display:flex}
.conn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.conn .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.conn .name{font-family:"Schibsted Grotesk",sans-serif;font-weight:700}
.conn .who{font:500 12.5px "IBM Plex Mono",monospace;color:var(--accent-ink)}
.conn .detail{font-size:13.5px;color:var(--muted)}
.conn .detail a{color:var(--accent-ink)}
.conn form{display:flex;gap:8px;flex-wrap:wrap}
.conn input{flex:1;min-width:220px;background:var(--mono-bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font:400 13px "IBM Plex Mono",monospace}
.conn input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.conn .msg{font-size:13px;font-weight:600;color:var(--accent-ink)}
.conn .msg.err{color:var(--signal)}
/* yolo toggle */
.yolo{display:inline-flex;align-items:center;gap:9px;font:600 13px "Source Sans 3",sans-serif;color:var(--muted);cursor:pointer;user-select:none}
.yolo .track{width:38px;height:21px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.yolo .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.yolo.on{color:var(--accent-ink)}
.yolo.on .track{background:var(--accent)}
.yolo.on .knob{left:19px}
/* work runs */
#work{margin-top:44px}
#work h2{font-family:"Schibsted Grotesk",sans-serif;font-weight:700;font-size:20px;margin:0 0 12px}
.run{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;display:flex;flex-direction:column;gap:9px}
.run .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.run .rtitle{font-family:"Schibsted Grotesk",sans-serif;font-weight:700;font-size:15.5px;flex:1;min-width:200px}
.rpill{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:4px 10px;border:1px solid var(--line);color:var(--muted)}
.rpill.running{border-color:var(--accent);color:var(--accent-ink);animation:pulse 1.4s ease-in-out infinite}
.rpill.failed{border-color:var(--signal);color:var(--signal)}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){.rpill.running{animation:none}}
.rlog{background:var(--mono-bg);border-radius:8px;padding:10px 14px;font:400 12.5px/1.6 "IBM Plex Mono",monospace;max-height:180px;overflow:auto;white-space:pre-wrap;color:var(--muted)}
.rreport{font-size:15px;white-space:pre-wrap;border-left:3px solid var(--accent);padding-left:14px}
.run form{display:flex;flex-direction:column;gap:8px}
.run textarea{min-height:64px}
/* ask-about-this */
.ask{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.ask input{flex:1;min-width:200px;background:var(--mono-bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font:400 14px "Source Sans 3",sans-serif}
.ask input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.answer{background:var(--mono-bg);border-radius:8px;padding:12px 15px;font-size:14.5px;white-space:pre-wrap}
.answer .q{font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Who needs you</h1>
    <span class="sub" id="brain-note">nothing sends without your yes</span>
  </header>
  <div class="bar">
    <button class="primary" id="triage-btn">Run triage</button>
    <span class="quiet" id="quiet-line"></span>
    <div id="conn-chips" title="connections — click to manage"></div>
    <span class="yolo" id="yolo" role="switch" aria-checked="false" tabindex="0" title="yolo mode: I do the rote work end-to-end; you keep decisions, sends and merges">
      <span class="track"><span class="knob"></span></span>yolo
    </span>
  </div>
  <div id="conn-panel"></div>
  <ul id="noise-list"></ul>
  <div id="queue-anchor"></div>
  <div id="queue"></div>
  <section id="work" hidden>
    <h2>Work</h2>
    <div id="runs"></div>
  </section>
</div>
<script>
const $ = (s, el=document) => el.querySelector(s);

async function api(path, opts) {
  const res = await fetch(path, opts ? {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(opts)} : undefined);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function card(item) {
  const el = document.createElement("div");
  el.className = "card lane" + item.lane;
  el.innerHTML = `
    <span class="tag">${item.lane === 4 ? "escalate now" : "needs you"} · ${item.source}</span>
    <div class="title">${item.url ? `<a href="${item.url}" target="_blank" rel="noopener">${esc(item.title)}</a>` : esc(item.title)}</div>
    <div class="summary">${esc(item.summary)}</div>
    <div class="reason">why: ${esc(item.reason)}</div>`;
  if (item.draft && item.action) {
    const label = document.createElement("span");
    label.className = "draft-label";
    label.textContent = "draft — edit freely; what you approve is exactly what sends";
    const ta = document.createElement("textarea");
    ta.value = item.draft;
    el.append(label, ta);
    const actions = document.createElement("div");
    actions.className = "actions";
    const approve = mkBtn("Approve & send", "primary", async () => {
      approve.disabled = true;
      try {
        const r = await api(`/api/items/${item.id}/approve`, { draft: ta.value });
        done(el, "✓ " + r.note);
      } catch (e) { fail(el, e); approve.disabled = false; }
    });
    actions.append(approve, workBtn(item), dismissBtn(item, el), noiseBtn(item, el));
    el.append(actions);
  } else {
    const actions = document.createElement("div");
    actions.className = "actions";
    actions.append(workBtn(item), dismissBtn(item, el, "Seen — clear it"), noiseBtn(item, el));
    el.append(actions);
  }
  el.append(askBox(item));
  return el;
}

function askBox(item) {
  const wrap = document.createElement("div");
  const form = document.createElement("form");
  form.className = "ask";
  const input = document.createElement("input");
  input.placeholder = "ask about this — context, who's involved, what your options are…";
  const btn = mkBtn("Ask", "", () => {});
  btn.type = "submit";
  form.append(input, btn);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    btn.disabled = true; btn.textContent = "Reading…";
    const box = document.createElement("div");
    box.className = "answer";
    box.innerHTML = `<span class="q">${esc(question)}</span>pulling the live issue and thinking…`;
    wrap.insertBefore(box, form);
    try {
      const r = await api(`/api/items/${item.id}/ask`, { question });
      box.innerHTML = `<span class="q">${esc(question)}</span>` + esc(r.answer);
      input.value = "";
    } catch (err) {
      box.innerHTML = `<span class="q">${esc(question)}</span>failed: ${esc(err.message)}`;
    } finally {
      btn.disabled = false; btn.textContent = "Ask";
    }
  });
  wrap.append(form);
  wrap.style.display = "flex";
  wrap.style.flexDirection = "column";
  wrap.style.gap = "8px";
  return wrap;
}

let yoloOn = false;
function workBtn(item) {
  const b = mkBtn("Go do it", "", async () => {
    if (!yoloOn) { alert("Flip the yolo switch first — then I do the work end-to-end."); return; }
    b.disabled = true; b.textContent = "On it…";
    try {
      await api("/api/work", { itemId: item.id });
      await loadRuns();
      document.querySelector("#work").scrollIntoView({ behavior: "smooth" });
    } catch (e) { alert(e.message); b.disabled = false; b.textContent = "Go do it"; }
  });
  b.title = "yolo: branch, code, test, push — then a report with the decisions that need you";
  if (!yoloOn) b.hidden = true;
  b.dataset.work = "1";
  return b;
}

function mkBtn(text, cls, onclick) {
  const b = document.createElement("button");
  if (cls) b.className = cls;
  b.textContent = text;
  b.addEventListener("click", onclick);
  return b;
}
function dismissBtn(item, el, label) {
  return mkBtn(label || "Not now", "", async () => {
    await api(`/api/items/${item.id}/dismiss`, {});
    el.remove();
  });
}
function noiseBtn(item, el) {
  return mkBtn("This is noise", "", async () => {
    const r = await api(`/api/items/${item.id}/noise`, {});
    done(el, "hidden — and the line moved: " + r.rule);
    setTimeout(() => el.remove(), 2500);
  });
}
function done(el, msg) {
  const s = document.createElement("div");
  s.className = "status";
  s.textContent = msg;
  el.append(s);
  el.querySelectorAll("button,textarea").forEach(n => n.disabled = true);
}
function fail(el, e) {
  const s = document.createElement("div");
  s.className = "status err";
  s.textContent = "failed: " + e.message;
  el.append(s);
}
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

async function load() {
  const data = await api("/api/queue");
  const q = $("#queue");
  q.replaceChildren();
  if (data.items.length === 0) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Nothing needs you. Run triage to check again.";
    q.append(e);
  } else {
    data.items.forEach(i => q.append(card(i)));
  }
  $("#quiet-line").innerHTML = `handled quietly: <b>${data.quiet}</b> ${data.quiet ? '· <a id="show-noise">show</a>' : ""}`;
  const nl = $("#noise-list");
  nl.replaceChildren(...data.noise.map(n => { const li = document.createElement("li"); li.textContent = n.title + " — " + n.summary; return li; }));
  const toggle = $("#show-noise");
  if (toggle) toggle.addEventListener("click", () => nl.classList.toggle("open"));
}

async function loadConnections() {
  const { connections } = await api("/api/connections");
  const chips = $("#conn-chips");
  chips.replaceChildren(...connections.map(c => {
    const chip = document.createElement("span");
    chip.className = "chip" + (c.connected ? " on" : "");
    chip.innerHTML = `<span class="dot"></span>${esc(c.name)}`;
    chip.addEventListener("click", () => $("#conn-panel").classList.toggle("open"));
    return chip;
  }));
  const panel = $("#conn-panel");
  const wasOpen = panel.classList.contains("open");
  panel.replaceChildren(...connections.map(connCard));
  if (wasOpen) panel.classList.add("open");
}

function connCard(c) {
  const el = document.createElement("div");
  el.className = "conn";
  const help = c.tokenHelpUrl ? ` <a href="${c.tokenHelpUrl}" target="_blank" rel="noopener">get a key →</a>` : "";
  el.innerHTML = `
    <div class="head">
      <span class="name">${esc(c.name)}</span>
      ${c.connected && c.who ? `<span class="who">✓ ${esc(c.who)}</span>` : ""}
    </div>
    <div class="detail">${esc(c.detail)}${c.connected ? "" : help}</div>`;
  if (c.acceptsToken) {
    if (!c.connected) {
      if (c.id === "linear") {
        const row = document.createElement("div");
        row.className = "actions";
        const msg = document.createElement("span");
        msg.className = "msg";
        const oauth = mkBtn("Sign in with Linear", "primary", async () => {
          oauth.disabled = true;
          msg.className = "msg";
          msg.textContent = "your browser is opening — approve access on Linear's page…";
          try {
            const r = await api("/api/connections/linear-oauth", {});
            msg.textContent = "connected: " + r.who;
            await loadConnections();
          } catch (err) {
            msg.className = "msg err";
            msg.textContent = err.message;
            oauth.disabled = false;
          }
        });
        row.append(oauth, msg);
        el.append(row);
        const or = document.createElement("div");
        or.className = "detail";
        or.textContent = "or paste an API key:";
        el.append(or);
      }
      const form = document.createElement("form");
      const input = document.createElement("input");
      input.type = "password";
      input.placeholder = c.id === "linear" ? "lin_api_…" : "xoxb-…";
      input.autocomplete = "off";
      const btn = mkBtn("Connect", "primary", () => {});
      btn.type = "submit";
      const msg = document.createElement("span");
      msg.className = "msg";
      form.append(input, btn, msg);
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true; msg.className = "msg"; msg.textContent = "checking with " + c.name + "…";
        try {
          const r = await api(`/api/connections/${c.id}`, { token: input.value });
          msg.textContent = "connected as " + r.who;
          await loadConnections();
        } catch (err) {
          msg.className = "msg err";
          msg.textContent = err.message + " — nothing was saved";
          btn.disabled = false;
        }
      });
      el.append(form);
    } else {
      const row = document.createElement("div");
      row.className = "actions";
      row.append(mkBtn("Disconnect", "", async () => {
        await fetch(`/api/connections/${c.id}`, { method: "DELETE" });
        await loadConnections();
      }));
      el.append(row);
    }
  }
  return el;
}

$("#triage-btn").addEventListener("click", async () => {
  const b = $("#triage-btn");
  b.disabled = true; b.textContent = "Reading your inbox…";
  try { await api("/api/triage", {}); await load(); }
  catch (e) { alert(e.message); }
  finally { b.disabled = false; b.textContent = "Run triage"; }
});

// --- yolo toggle ---
async function loadYolo() {
  const { on } = await api("/api/yolo");
  yoloOn = on;
  renderYolo();
}
function renderYolo() {
  const y = $("#yolo");
  y.classList.toggle("on", yoloOn);
  y.setAttribute("aria-checked", String(yoloOn));
  document.querySelectorAll("[data-work]").forEach(b => b.hidden = !yoloOn);
}
async function toggleYolo() {
  const { on } = await api("/api/yolo", { on: !yoloOn });
  yoloOn = on;
  renderYolo();
}
$("#yolo").addEventListener("click", toggleYolo);
$("#yolo").addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleYolo(); } });

// --- work runs ---
let runsTimer = null;
async function loadRuns() {
  const { runs } = await api("/api/runs");
  $("#work").hidden = runs.length === 0;
  const box = $("#runs");
  box.replaceChildren(...runs.map(runCard));
  const anyRunning = runs.some(r => r.status === "running");
  clearTimeout(runsTimer);
  if (anyRunning) runsTimer = setTimeout(loadRuns, 3000);
}
function runCard(r) {
  const el = document.createElement("div");
  el.className = "run";
  const head = document.createElement("div");
  head.className = "head";
  head.innerHTML = `<span class="rtitle">${esc(r.title)}</span><span class="rpill ${r.status}">${r.status === "running" ? "working…" : r.status}</span>`;
  el.append(head);
  if (r.status === "running" && r.log) {
    const log = document.createElement("div");
    log.className = "rlog";
    log.textContent = r.log.slice(-3000);
    el.append(log);
    log.scrollTop = log.scrollHeight;
  }
  if (r.status !== "running" && r.report) {
    const rep = document.createElement("div");
    rep.className = "rreport";
    rep.textContent = r.report;
    el.append(rep);
  }
  if (r.status !== "running" && r.sessionId) {
    const form = document.createElement("form");
    const ta = document.createElement("textarea");
    ta.placeholder = "answer its questions / tell it what to change — it picks up where it left off";
    const send = mkBtn("Answer & continue", "primary", () => {});
    send.type = "submit";
    form.append(ta, send);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!ta.value.trim()) return;
      send.disabled = true;
      try { await api(`/api/runs/${r.id}/continue`, { answer: ta.value }); await loadRuns(); }
      catch (err) { alert(err.message); send.disabled = false; }
    });
    el.append(form);
  }
  return el;
}

load();
loadConnections();
loadYolo();
loadRuns();
</script>
</body>
</html>
