<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪞</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<div id="topbar"><div class="in">
  <a class="wordmark" href="#/queue">stand<span class="tld">in</span></a>
  <span id="brain" title="the brain this session runs on">…</span>
  <nav id="tabs">
    <a href="#/queue" data-view="queue"><span class="tab-label">Queue</span><span class="badge signal" id="badge-queue" hidden></span></a>
    <a href="#/work" data-view="work"><span class="tab-label">Work</span><span class="badge" id="badge-work" hidden></span></a>
    <a href="#/connections" data-view="connections"><span class="tab-label">Connections</span><span id="conn-dots"></span></a>
    <a href="#/ledger" data-view="ledger"><span class="tab-label">Ledger</span></a>
  </nav>
  <span class="grow"></span>
  <span class="yolo" id="autopilot" role="switch" aria-checked="false" tabindex="0" title="auto-brief: every new task automatically gets an agent that gathers context and briefs you — nothing executes before your go">
    <span class="track"><span class="knob"></span></span>auto-brief
  </span>
  <span class="yolo" id="yolo" role="switch" aria-checked="false" tabindex="0" title="yolo: agents may work end-to-end; decisions, sends and merges stay yours">
    <span class="track"><span class="knob"></span></span>yolo
  </span>
</div></div>

<main>
  <section id="view-queue" hidden>
    <div class="col list">
      <div class="listhead">
        <button class="primary" id="triage-btn">Run triage</button>
        <span id="pulse"></span>
      </div>
      <ul id="noise-list" hidden></ul>
      <div id="q-list" class="rows"></div>
    </div>
    <div class="col detail" id="q-detail"></div>
  </section>

  <section id="view-work" hidden>
    <div class="col list">
      <form id="new-task">
        <input id="task-input" placeholder="give an agent a task — it briefs you before touching anything">
        <button class="primary" type="submit">Run agent</button>
      </form>
      <div id="w-list" class="rows"></div>
    </div>
    <div class="col detail" id="w-detail"></div>
  </section>

  <section id="view-connections" hidden>
    <div class="scrollpane">
      <h2 class="viewtitle">Connections</h2>
      <div id="conn-progress"></div>
      <div id="conn-grid"></div>
    </div>
  </section>

  <section id="view-ledger" hidden>
    <div class="scrollpane">
      <h2 class="viewtitle">Ledger — nothing sent without a yes</h2>
      <table id="ledger"><tbody id="ledger-body"></tbody></table>
    </div>
  </section>
</main>

<div id="toasts"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
